    <style>
        /* =========================================
           VARIÁVEIS DE CORES E DESIGN PREMIUM
           ========================================= */
        :root {
            /* Cores da Pizzaria no Fundo (Vermelho Escuro e Preto Premium) */
            --bg-gradient-start: #230404; 
            --bg-gradient-end: #0a0a0a;
            --text-light: #FFFFFF;
            
            /* Cores das Plataformas */
            --ifood-color: #EA1D2C;
            --food99-color: #F6B32E;
            --keeta-color: #FFB800; /* Laranja/Amarelo característico */
        }

        /* =========================================
           RESET E BASE
           ========================================= */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }

        body {
            /* Fundo com as cores da pizzaria, criando um clima "apetitoso" */
            background: radial-gradient(circle at top, var(--bg-gradient-start) 0%, var(--bg-gradient-end) 100%);
            color: var(--text-light);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            overflow-x: hidden;
            padding-bottom: 50px;
        }

        .main-container {
            width: 100%;
            max-width: 500px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        /* =========================================
           CABEÇALHO (LOGO E BIO)
           ========================================= */
        .header {
            text-align: center;
            margin-top: 40px;
            margin-bottom: 25px;
            padding: 0 20px;
            animation: fadeInDown 0.8s ease;
        }

        .logo-wrapper {
            width: 120px;
            height: 120px;
            border-radius: 50%;
            border: 4px solid #fff;
            box-shadow: 0 8px 25px rgba(234, 29, 44, 0.4);
            overflow: hidden;
            margin: 0 auto 15px auto;
            background-color: #fff;
        }

        .logo-wrapper img {
            width: 100%;
            height: 100%;
            object-fit: contain; /* Nunca corta a logo */
        }

        .header h1 {
            font-size: 1.6rem;
            font-weight: 800;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            margin-bottom: 5px;
            text-shadow: 0 2px 4px rgba(0,0,0,0.8);
        }

        .header p {
            font-size: 1.05rem;
            color: #e0e0e0;
            font-weight: 500;
            font-style: italic;
        }

        /* =========================================
           CARROSSEL INFINITO (FOTOS DAS PIZZAS)
           ========================================= */
        .carousel-section {
            width: 100vw;
            margin-bottom: 35px;
            overflow: hidden;
            position: relative;
            /* Máscara para suavizar as bordas na entrada e saída */
            -webkit-mask-image: linear-gradient(to right, transparent, black 5%, black 95%, transparent);
            mask-image: linear-gradient(to right, transparent, black 5%, black 95%, transparent);
        }

        .carousel-track {
            display: flex;
            width: calc(260px * 8 + 15px * 8); /* 8 itens totais (4 originais + 4 duplicados) */
            animation: scroll-carousel 20s linear infinite;
        }

        .carousel-track:hover {
            animation-play-state: paused;
        }

        .carousel-item {
            width: 260px;
            height: 190px;
            margin: 0 7.5px;
            border-radius: 16px;
            overflow: hidden;
            position: relative;
            box-shadow: 0 10px 20px rgba(0,0,0,0.5);
            border: 1px solid rgba(255,255,255,0.1);
        }

        .carousel-item img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            transition: transform 0.4s ease;
        }

        .carousel-item:hover img {
            transform: scale(1.1);
        }

        @keyframes scroll-carousel {
            0% { transform: translateX(0); }
            100% { transform: translateX(calc(-260px * 4 - 15px * 4)); }
        }

        /* =========================================
           CARDS DE PLATAFORMAS (DESIGN "FULL FODA")
           ========================================= */
        .links-section {
            width: 100%;
            padding: 0 20px;
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        .platform-card {
            position: relative;
            display: flex;
            align-items: center;
            justify-content: space-between;
            width: 100%;
            height: 100px;
            border-radius: 18px;
            text-decoration: none;
            overflow: hidden;
            padding: 0 20px;
            background: rgba(255, 255, 255, 0.03);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
            transition: all 0.2s ease;
        }

        /* Bordas brilhantes baseadas na marca */
        .card-keeta { border-left: 6px solid var(--keeta-color); }
        .card-ifood { border-left: 6px solid var(--ifood-color); }
        .card-99food { border-left: 6px solid var(--food99-color); }

        .platform-card:active {
            transform: scale(0.96);
        }

        /* Imagem da Plataforma */
        .platform-logo-box {
            display: flex;
            align-items: center;
            gap: 12px;
            z-index: 2;
        }

        .platform-logo-box img {
            height: 35px;
            width: auto;
            max-width: 120px;
            object-fit: contain;
            filter: drop-shadow(0 2px 4px rgba(0,0,0,0.5));
        }

        /* Título alternativo caso a imagem da plataforma não carregue perfeitamente */
        .platform-name-fallback {
            font-size: 1.4rem;
            font-weight: 900;
            text-shadow: 0 2px 4px rgba(0,0,0,0.8);
        }

        .text-keeta { color: var(--keeta-color); }
        .text-ifood { color: var(--ifood-color); }
        .text-99food { color: var(--food99-color); }

        /* Botão "Pedir Agora" pulsante */
        .cta-btn {
            z-index: 2;
            padding: 10px 18px;
            border-radius: 30px;
            font-size: 0.95rem;
            font-weight: 700;
            color: #FFF;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.3);
            animation: pulse-btn 2s infinite;
        }

        .btn-keeta { background-color: var(--keeta-color); color: #000; }
        .btn-ifood { background-color: var(--ifood-color); }
        .btn-99food { background-color: var(--food99-color); color: #000; }

        @keyframes pulse-btn {
            0% { transform: scale(1); }
            50% { transform: scale(1.06); }
            100% { transform: scale(1); }
        }

        @keyframes fadeInDown {
            from { opacity: 0; transform: translateY(-20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* Gradiente de fundo de cada card para dar contraste */
        .platform-card::before {
            content: '';
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            background: linear-gradient(90deg, rgba(0,0,0,0.8) 0%, rgba(0,0,0,0.3) 100%);
            z-index: 1;
        }

        /* Imagens de fundo sutis nos cards para textura */
        .card-keeta { background-image: url('https://i.ibb.co/RL9XCL8/Calabresa-1.png'); background-size: cover; background-position: center; }
        .card-ifood { background-image: url('https://i.ibb.co/hRV7v0b9/Pizza-doce-limoneto-ifood.png'); background-size: cover; background-position: center; }
        .card-99food { background-image: url('https://i.ibb.co/PZTXzSkR/Atum-1.png'); background-size: cover; background-position: center; }
